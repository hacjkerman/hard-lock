<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #c42b1c; } a:hover { color: #a32316; }
    .num { font-variant-numeric: tabular-nums; }
    .micro { font-size: 11px; font-weight: 590; letter-spacing: 0.6px; text-transform: uppercase; }
  </style>
</helmet>
<div style="width: 393px; height: 852px; background: #efedea; color: #1a1a1a; display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 58px 16px 6px 16px; display: flex; align-items: center; gap: 4px;">
    <svg width="11" height="18" viewBox="0 0 8 13" fill="none" stroke="#c42b1c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 1.5 L1.5 6.5 L6.5 11.5"></path></svg>
    <div style="font-size: 17px; color: #c42b1c;">Hard Lock</div>
  </div>
  <div style="padding: 4px 20px 10px 20px;">
    <div style="font-size: 34px; font-weight: 700; letter-spacing: -0.6px;">Pending</div>
  </div>

  <div style="padding: 8px 16px 0 16px; display: flex; flex-direction: column; gap: 22px;">

    <div style="background: #ffffff; border-radius: 14px; padding: 18px 18px 16px 18px; display: flex; flex-direction: column; gap: 15px;">
      <div style="display: flex; align-items: flex-start; gap: 12px;">
        <div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1;">
          <div style="font-size: 17px; font-weight: 590;">Saturday</div>
          <div style="display: flex; align-items: center; gap: 8px;">
            <div class="num" style="font-size: 15px; color: rgba(0,0,0,0.4); text-decoration: line-through;">01:30</div>
            <svg width="14" height="10" viewBox="0 0 14 10" fill="none" stroke="rgba(0,0,0,0.3)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1 5h11M8.5 1.5L12 5l-3.5 3.5"></path></svg>
            <div class="num" style="font-size: 15px; font-weight: 590; color: #8a6508;">02:30</div>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px;">
          <div class="num" style="font-size: 26px; font-weight: 250; letter-spacing: -0.8px; line-height: 1; color: #8a6508;">23:41</div>
          <div class="micro" style="color: rgba(0,0,0,0.35);">remaining</div>
        </div>
      </div>

      <div style="height: 4px; border-radius: 2px; background: rgba(0,0,0,0.07); overflow: hidden; display: flex;">
        <div style="width: 8%; background: #b8860b; border-radius: 2px;"></div>
      </div>

      <div style="height: 1px; background: rgba(0,0,0,0.07);"></div>

      <div style="display: flex; align-items: center; gap: 10px;">
        <div style="font-size: 13.5px; color: rgba(0,0,0,0.5); flex-grow: 1; line-height: 1.35;">Applies Sat 6 Sep, 11:41&nbsp;am</div>
        <div style="height: 34px; padding: 0 15px; border-radius: 9px; background: rgba(196,43,28,0.09); display: flex; align-items: center; justify-content: center;">
          <div style="font-size: 15px; font-weight: 560; color: #c42b1c;">Cancel</div>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="font-size: 13px; color: rgba(0,0,0,0.45); line-height: 1.45; padding: 0 16px; text-wrap: pretty;">
        Only loosening waits here. Tightening applies the moment you set it and never appears on this screen.
      </div>
      <div style="font-size: 13px; color: rgba(0,0,0,0.45); line-height: 1.45; padding: 0 16px; text-wrap: pretty;">
        Cancelling drops the change &mdash; it does not restart the clock. There is no way to skip the wait.
      </div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
