<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #ff99a4; } a:hover { color: #ffb3bb; }
    .num { font-variant-numeric: tabular-nums; }
    .micro { font-size: 11px; font-weight: 590; letter-spacing: 0.6px; text-transform: uppercase; }
  </style>
</helmet>
<div style="width: 393px; height: 852px; background: #141312; color: #ffffff; display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 62px 20px 8px 20px;">
    <div style="font-size: 34px; font-weight: 700; letter-spacing: -0.6px; line-height: 1.1;">Hard Lock</div>
  </div>

  <div style="padding: 16px 16px 0 16px; display: flex; flex-direction: column; gap: 22px; flex-grow: 1;">

    <div style="background: #232120; border-radius: 14px; padding: 22px 20px 20px 20px; display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <div style="width: 8px; height: 8px; border-radius: 4px; background: #6ccb5f;"></div>
        <div class="micro" style="color: #6ccb5f;">Armed &middot; tonight</div>
      </div>
      <div style="display: flex; align-items: baseline; gap: 10px;">
        <div class="num" style="font-size: 76px; font-weight: 200; letter-spacing: -3.5px; line-height: 0.95;">4:12</div>
        <div style="font-size: 15px; color: rgba(255,255,255,0.62); font-weight: 400;">until cutoff</div>
      </div>
      <div style="height: 1px; background: rgba(255,255,255,0.08);"></div>
      <div style="display: flex; gap: 36px;">
        <div style="display: flex; flex-direction: column; gap: 3px;">
          <div class="micro" style="color: rgba(255,255,255,0.42);">Locks at</div>
          <div class="num" style="font-size: 19px; font-weight: 500;">23:30</div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 3px;">
          <div class="micro" style="color: rgba(255,255,255,0.42);">Clears at</div>
          <div class="num" style="font-size: 19px; font-weight: 500;">04:00</div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 3px;">
          <div class="micro" style="color: rgba(255,255,255,0.42);">Tonight is</div>
          <div style="font-size: 19px; font-weight: 500;">Friday</div>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div class="micro" style="color: rgba(255,255,255,0.42); padding-left: 16px;">Rules</div>
      <div style="background: #232120; border-radius: 14px; overflow: hidden;">

        <div style="display: flex; align-items: center; gap: 12px; padding: 0 16px; height: 52px;">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#ff99a4" stroke-width="1.8" stroke-linecap="round">
            <circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path>
          </svg>
          <div style="font-size: 17px; flex-grow: 1;">Cutoff times</div>
          <div class="num" style="font-size: 17px; color: rgba(255,255,255,0.42);">7 days</div>
          <svg width="8" height="13" viewBox="0 0 8 13" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="2" stroke-linecap="round"><path d="M1.5 1.5 L6.5 6.5 L1.5 11.5"></path></svg>
        </div>
        <div style="height: 1px; background: rgba(255,255,255,0.08); margin-left: 49px;"></div>

        <div style="display: flex; align-items: center; gap: 12px; padding: 0 16px; height: 52px;">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#ff99a4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6z"></path><path d="M9 12l2 2 4-4"></path>
          </svg>
          <div style="font-size: 17px; flex-grow: 1;">Commitment</div>
          <div style="font-size: 17px; color: rgba(255,255,255,0.42);">None</div>
          <svg width="8" height="13" viewBox="0 0 8 13" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="2" stroke-linecap="round"><path d="M1.5 1.5 L6.5 6.5 L1.5 11.5"></path></svg>
        </div>
        <div style="height: 1px; background: rgba(255,255,255,0.08); margin-left: 49px;"></div>

        <div style="display: flex; align-items: center; gap: 12px; padding: 0 16px; height: 52px;">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#fce100" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v9l5 3"></path><circle cx="12" cy="12" r="9"></circle>
          </svg>
          <div style="font-size: 17px; flex-grow: 1;">Pending changes</div>
          <div style="min-width: 21px; height: 21px; border-radius: 11px; background: #fce100; color: #141312; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 6px;">1</div>
          <svg width="8" height="13" viewBox="0 0 8 13" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="2" stroke-linecap="round"><path d="M1.5 1.5 L6.5 6.5 L1.5 11.5"></path></svg>
        </div>
      </div>
      <div style="font-size: 13px; color: rgba(255,255,255,0.42); line-height: 1.4; padding: 2px 16px 0 16px;">
        Earlier cutoffs apply at once. Later ones wait out a 24-hour cooldown.
      </div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
