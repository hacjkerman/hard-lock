<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hard Lock — History</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="history.css" />
</head>
<body>
  <div class="win">
    <div class="win-titlebar">
      <svg class="brand-mark" viewBox="0 0 256 256" width="16" height="16" aria-hidden="true">
        <rect x="16" y="16" width="224" height="224" rx="56" fill="#cf3020"/>
        <path d="M100 122 V96 a28 28 0 0 1 56 0 V122" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round"/>
        <rect x="76" y="116" width="104" height="90" rx="16" fill="#fff"/>
        <path d="M137.75 150.1 A17 17 0 1 1 118.25 150.1" fill="none" stroke="#cf3020" stroke-width="7" stroke-linecap="round"/>
        <line x1="128" y1="143" x2="128" y2="163" stroke="#cf3020" stroke-width="7" stroke-linecap="round"/>
      </svg>
      <span class="win-title">Hard Lock</span>
      <span class="win-subtitle">History</span>
    </div>

    <div class="history-scroll">
      <div class="history-inner">
        <div class="eyebrow">Last 42 days</div>
        <h1>History</h1>
        <p class="intro">Active computer time per day. Shutdowns marked.</p>

        <div class="stats-grid" id="stats-grid"></div>

        <div class="card chart-card">
          <div class="chart-head">
            <div class="chart-title">Active time per day</div>
            <div class="legend">
              <span><i class="swatch" style="background: var(--accent)"></i>active</span>
              <span><i class="swatch" style="background: var(--red)"></i>hit cap</span>
              <span><i class="ring"></i>shutdown</span>
            </div>
          </div>
          <div class="chart" id="chart"></div>
          <div class="chart-axis" id="chart-axis"></div>
        </div>

        <div class="card events-card">
          <div class="events-title">Recent lock events</div>
          <div id="events-list" class="events-list"></div>
          <div id="events-empty" class="events-empty hidden">No events recorded yet.</div>
        </div>
      </div>
    </div>
  </div>

  <script src="history.js"></script>
</body>
</html>
